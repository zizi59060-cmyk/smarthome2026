# Override smarthome_vision parameters for the integrated one-serial-port stack.
smarthome_vision_node:
  ros__parameters:
    image_topic: "/image_raw"
    show_debug: true
    use_cuda_preprocess: true

    # The integrated stack does not let vision open the lower-computer serial
    # port. Use a fixed mode while smarthome_comm owns /dev/ttyACM0.
    use_test_mode: true
    test_mode: 1
    serial_device: ""

    use_local_camera: true
    camera_device_id: 0
    camera_width: 640
    camera_height: 480
    camera_fps: 30
    object_engine_path: "/home/nvidia4/smarthome_2026/ws/src/smarthome_vision/src/smarthome_vision_ros2/assets/object.engine"
    qr_engine_path: "/home/nvidia4/smarthome_2026/ws/src/smarthome_vision/src/smarthome_vision_ros2/assets/qrcode.engine"
    object_conf_threshold: 0.25
    qr_conf_threshold: 0.25
